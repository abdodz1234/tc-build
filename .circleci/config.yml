version: 2.1

executors:
  arch_executor:
    docker:
      - image: archlinux:latest
    resource_class: 2 X-large+

jobs:
  build-toolchain:
    executor: arch_executor
    steps:
       - checkout
       - run:
          name: Install dependencies
          command: |
            pacman -Sy --needed --noconfirm openssh archlinux-keyring
            pacman -Syu --needed --noconfirm base-devel \
              bc bison ccache clang cpio cmake flex git libelf \
              lld llvm ninja openssl python3 patchelf

       - run:
          name: Clone and build
          command: |
            pacman -Sy --needed  --noconfirm  archlinux-keyring git
            git clone git@github.com:abdodz1234/tc-build.git
            cd tc-build
            bash build-toolchain.sh

workflows:
  version: 2
  build:
    jobs:
      - build-toolchain
